volumes:
  n8n_storage:
  postgres_storage:
  ollama_storage:
  qdrant_storage:

networks:
  n8n-local:

x-n8n: &service-n8n
  image: docker.n8n.io/n8nio/n8n:latest
  networks: [n8n-local]
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_PORT=5432
    - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
    - DB_POSTGRESDB_USER=${POSTGRES_USER}
    - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
    - N8N_HOST=${N8N_HOST:-localhost}
    - N8N_PORT=5678
    - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
    - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
    - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL:-http://localhost:5678/}
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_COMMUNITY_PACKAGES_ENABLED=true
    - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET}
    - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
    - TZ=${TZ}
    - OLLAMA_HOST=${OLLAMA_HOST:-ollama:11434}
    - N8N_RESTRICT_FILE_ACCESS_TO=/data;/home/node/.n8n-files
  env_file:
    - .env

services:
  postgres:
    image: postgres:16-alpine
    networks: [n8n-local]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    networks: [n8n-local]
    restart: unless-stopped
    ports:
      - '11434:11434'
    volumes:
      - ollama_storage:/root/.ollama

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    networks: [n8n-local]
    restart: unless-stopped
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_storage:/qdrant/storage

  ollama-pull:
    image: ollama/ollama:latest
    networks: [n8n-local]
    container_name: ollama-pull-models
    volumes:
      - ollama_storage:/root/.ollama
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: /bin/sh
    command:
      - '-c'
      - |
        echo "Waiting for Ollama..."
        until ollama list >/dev/null 2>&1; do sleep 2; done
        echo "Pulling llama3.2 (text)..."
        ollama pull llama3.2
        echo "Pulling qwen2.5-coder:7b (Code Companion agent)..."
        ollama pull qwen2.5-coder:7b
        echo "Pulling nomic-embed-text (RAG embeddings)..."
        ollama pull nomic-embed-text
        echo "Models ready."
    depends_on:
      - ollama

  n8n-import:
    <<: *service-n8n
    container_name: n8n-import
    entrypoint: /bin/sh
    command:
      - '-c'
      - |
        count=$$(n8n list:workflow --onlyId 2>/dev/null | wc -l | tr -d ' ')
        if [ "$$count" -eq 0 ]; then
          echo "Importing sample workflows..."
          n8n import:workflow --separate --input=/demo-data/workflows
        else
          echo "Workflows already exist ($$count), skipping import."
        fi
    volumes:
      - ./workflows:/demo-data/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    <<: *service-n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - '5678:5678'
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./workflows:/demo-data/workflows:ro
      - ./shared:/data/shared
      - ./docs:/data/docs:ro
      - ./improve-codebase-architecture:/data/architecture:ro
    depends_on:
      postgres:
        condition: service_healthy
      n8n-import:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
